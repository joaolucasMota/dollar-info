<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotação do Dólar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .atualizar-btn {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            display: block;
            margin: 0 auto 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
        }

        .atualizar-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .atualizar-btn:active {
            transform: translateY(1px);
        }

        .cotacao-info {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transform: translateY(0);
        }

        .cotacao-info:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .cotacao-info h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .cotacao-info p {
            color: #444;
            margin: 10px 0;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cotacao-info span {
            font-weight: bold;
            color: #2a5298;
            background: rgba(42, 82, 152, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
        }

        #variacao.positivo {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        #variacao.negativo {
            color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #resultado {
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .cotacao-info p {
                flex-direction: column;
                align-items: flex-start;
            }

            .cotacao-info span {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cotação do Dólar</h1>
        <button class="atualizar-btn" onclick="buscarCotacao()">Atualizar Cotação</button>
        <div id="resultado">
            <div class="cotacao-info">
                <h3>Valor do Dólar:</h3>
                <p>Compra: R$ <span id="valorCompra">--</span></p>
                <p>Venda: R$ <span id="valorVenda">--</span></p>
            </div>
            <div class="cotacao-info">
                <h3>Variação:</h3>
                <p>Variação: <span id="variacao">--</span>%</p>
                <p>Máxima: R$ <span id="maxima">--</span></p>
                <p>Mínima: R$ <span id="minima">--</span></p>
            </div>
            <div class="cotacao-info">
                <p>Última atualização: <span id="atualizacao">--</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
